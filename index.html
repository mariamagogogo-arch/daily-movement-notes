<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#225c4c"><title>动一点 · 日常运动记录</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#213c34;font:16px system-ui,sans-serif}main{max-width:520px;margin:auto;padding:28px 20px 60px}h1{font-size:32px;margin:6px 0}p{color:#68796e;line-height:1.7}section{background:white;border-radius:22px;padding:20px;margin:18px 0}button,input,select{font:inherit;border-radius:12px;padding:13px;border:1px solid #d4ded5}button{background:#eaf1e9;color:#244d3e;cursor:pointer}input,select{width:100%;background:white;color:#213c34;margin:6px 0 14px}label{font-size:14px}small{color:#68796e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;background:#225c4c;color:white;border:0}.item{padding:16px 0;border-bottom:1px solid #edf0e9}.item button{padding:6px 10px;margin:10px 8px 0 0;font-size:13px}h2{font-size:20px}.notice{font-size:13px}#status{min-height:24px;color:#225c4c}</style><main><small>给自己留一点时间</small><h1>动一点 🌿</h1><p>每一次活动都值得记下。<br>不用补打卡，也不用追赶进度。</p><section><h2>记下一次活动</h2><div class="grid" id="quick"></div><form id="form"><input id="editId" type="hidden"><label>活动<select id="kind"><option>散步</option><option>站桩</option><option>静坐</option><option>俯卧撑</option><option>力量训练</option><option>拉伸</option><option>其他</option></select></label><label>开始时间<input id="time" type="datetime-local" required></label><div class="grid"><label>记录方式<select id="unit"><option value="分钟">时长（分钟）</option><option value="次">次数（每组）</option></select></label><label>数量<input id="amount" type="number" min="1" max="1440" required value="10"></label></div><label id="setsLabel" hidden>组数<input id="sets" type="number" min="1" max="100" value="1"></label><label>感觉<select id="effort"><option>未记录</option><option>轻松</option><option>适中</option><option>吃力</option></select></label><button class="primary">保存记录</button><button type="button" id="cancel" hidden>取消修改</button><div id="status" role="status"></div></form></section><section><h2>我的一天</h2><input id="day" type="date"><p id="summary"></p><div id="list"></div></section><section><h2>数据备份</h2><p class="notice">记录只保存在当前手机浏览器，不上传云端。清理浏览器数据或更换手机可能丢失，请定期导出备份。</p><button id="export">导出备份</button><label>恢复备份<input id="import" type="file" accept="application/json"></label></section></main><script src="app.js"></script></html>
